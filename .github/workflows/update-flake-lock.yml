name: Update flake.lock

on:
  schedule:
    - cron: '0 0 * * 1'  # every Monday at midnight UTC
  workflow_dispatch:       # allow manual runs from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v13
      - uses: DeterminateSystems/update-flake-lock@v23
        with:
          pr-title: "chore: update flake.lock"
          pr-labels: automated
          commit-msg: "chore: update flake.lock"

      - name: Notify on failure
        if: failure()
        run: |
          gh issue create \
            --title "Weekly flake.lock update failed" \
            --body "The scheduled flake.lock update failed. [View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" \
            --label "bug"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
