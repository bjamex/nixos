shell_integration no-rc
font_size 12
window_padding_width 8 8 8 8
hide_window_decorations yes
cursor_shape beam
confirm_os_window_close 0
enable_audio_bell no
# Disable config auto-reload: kitty's config watcher follows the
# hjem store-symlinked kitty.conf into /nix/store and leaks inotify watches
# until the pool is exhausted (crashes Minecraft etc.). This setting is a
# float poll-interval in seconds; a negative value disables the watcher.
# Reload manually with ctrl+shift+f5 or: kill -SIGUSR1 $KITTY_PID
auto_reload_config -1
tab_bar_style separator
tab_separator  |
input_delay 0
cursor_trail 1
cursor_trail_decay 0.07 0.15
sync_to_monitor no

allow_remote_control yes
listen_on unix:/tmp/kitty

include themes/noctalia.conf
