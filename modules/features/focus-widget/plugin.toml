# Focus Rite — an eldritch Pomodoro timer that lives in the Noctalia bar.
#
# A [[widget]] (bar-widget) entry: shows the remaining time + a phase glyph,
# left-click stays/unbinds the rite (start/pause), right-click severs it (skip
# to the next phase), and hovering reveals the full state. Colours use the
# semantic theme roles, so it bleeds whatever palette Noctalia is on (Eldritch).
#
# Install path: ~/.local/share/noctalia/plugins/styx-focus/  (managed by hjem).
# Enable + place via Noctalia Settings → Plugins, then add the widget to the bar.

id = "styx/focus"
name = "Focus Rite"
version = "1.0.0"
min_noctalia = "5.0.0"
author = "swin"
license = "MIT"
tags = ["timer", "pomodoro", "focus", "eldritch"]
icon = "flame"
description = "An eldritch Pomodoro focus rite — bar timer with hover details and click control."

[[widget]]
id = "rite"
entry = "focus.luau"

  [[widget.setting]]
  key = "work"
  type = "int"
  label = "Ritual minutes (focus)"
  description = "Length of a focus block."
  default = 25
  min = 1
  max = 180
  step = 1

  [[widget.setting]]
  key = "short"
  type = "int"
  label = "Veil-thinning minutes (short break)"
  default = 5
  min = 1
  max = 60
  step = 1

  [[widget.setting]]
  key = "long"
  type = "int"
  label = "Slumber minutes (long break)"
  default = 15
  min = 1
  max = 120
  step = 1

  [[widget.setting]]
  key = "rounds"
  type = "int"
  label = "Rituals before the long slumber"
  default = 4
  min = 1
  max = 12
  step = 1

  [[widget.setting]]
  key = "auto_start"
  type = "bool"
  label = "Begin the next rite automatically"
  description = "If off, each phase waits for a click before counting down."
  default = false
