[project]
name = "hades"
revision = "1.0"

# Declaration only — names + descriptions of the secrets each migrated service
# needs. Values are NEVER stored here; they live in the provider backend
# (hades: `pass`, a GPG-encrypted store on the box — see docs/hades-roadmap.md).
#
# Set a value on hades (as root, with the store env — see roadmap for setup):
#   export PASSWORD_STORE_DIR=/var/lib/secretspec/password-store
#   export GNUPGHOME=/var/lib/secretspec/gnupg
#   secretspec set CLOUDFLARE_API_TOKEN --provider pass --reason "provisioning"
# Verify everything the spec requires is present:
#   secretspec check --provider pass
# Rotate: `secretspec set …` again (re-encrypts the entry; git-track the store
# for history), then restart secretspec-<unit> + the service.
#
# Convention: prefix each service's secrets (CLOUDFLARE_, ADGUARD_, ...) so the
# per-service env-file filter in modules/features/secretspec.nix can select them.

[profiles.default]
# Caddy uses this for ACME DNS-01 cert issuance against Cloudflare.
CLOUDFLARE_API_TOKEN = { description = "Cloudflare API token, Zone.DNS:Edit scoped to swinlab.net (Caddy ACME DNS-01)", required = true }
