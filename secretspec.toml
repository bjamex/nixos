[project]
name = "hades"
revision = "1.0"

# Declaration only — names + descriptions of the secrets each migrated service
# needs. Values are NEVER stored here; they live in the provider backend
# (hades: Google Cloud Secret Manager, see docs/hades-roadmap.md).
#
# Set a value (from anywhere authenticated to the GCP project):
#   export GOOGLE_APPLICATION_CREDENTIALS=/path/to/gcp-sa.json   # or `gcloud auth`
#   secretspec set ADGUARD_ADMIN_PASSWORD \
#     --provider gcsm://<project-id> --reason "initial provisioning"
# Verify everything the spec requires is present:
#   secretspec check --provider gcsm://<project-id>
# Rotate: `secretspec set …` (adds a new GCSM secret version).
#
# Convention: prefix each service's secrets (ADGUARD_, IMMICH_, ...) so the
# per-service env-file filter in modules/features/secretspec.nix can select them.

[profiles.default]
# Populated as services are migrated. Example (uncomment when the pilot lands):
# ADGUARD_ADMIN_PASSWORD = { description = "AdGuard Home admin password", required = true }
